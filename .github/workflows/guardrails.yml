name: Guardrails

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: guardrails-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  guardrails:
    name: guardrails
    # Ubuntu 24.04 AppArmor blocks this pinned Chromium user-namespace sandbox.
    # Keep the browser sandbox enabled on the supported Ubuntu 22.04 image.
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install exact dependencies
        run: bun install --frozen-lockfile

      - name: Verify repository contract
        run: bun run verify

      - name: Install Playwright Chromium
        run: bun run browser:install

      - name: Verify completed apps browser specs
        run: bun run app:verify --app numeronym-generator

      - name: Verify model workshop UI in a real browser
        run: bun run app:verify --app building-ai-models-without-coding

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: browser-test-results
          path: apps/*/test-results/

  portability:
    name: portability (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install exact dependencies on macOS
        if: runner.os != 'Windows'
        run: bun install --frozen-lockfile

      # Keep the isolated linker and global store. A job-local, same-volume
      # cache avoids cross-volume copy fallback and shared-cache collisions.
      # See docs/operations/ci-package-and-secret-scanning.md.
      - name: Install exact dependencies on Windows
        if: runner.os == 'Windows'
        env:
          BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/../.bun-cache
        run: bun install --frozen-lockfile --verbose

      - name: Diagnose native environment
        run: bun run setup:doctor

      - name: Verify cross-platform repository contract
        run: bun run verify

      - name: Install pinned Playwright Chromium
        run: bun run browser:install

      - name: Verify reference app in a real browser
        run: bun run app:verify --app numeronym-generator

      - name: Verify model workshop UI in a real browser
        run: bun run app:verify --app building-ai-models-without-coding

      - name: Upload native browser results on failure
        if: failure()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: browser-test-results-${{ matrix.os }}
          path: apps/*/test-results/

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out complete history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install pinned open-source scanner
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          minimum_release_age: 7d
          install_args: gitleaks

      - name: Scan complete history for secrets
        run: mise exec -- gitleaks git --log-opts="--all" --redact --no-banner .
